<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 400px;
            width: 400px;
            border-radius: 50%;
            background-color: pink;
            background-image: conic-gradient(red 0deg, yellow 45deg, green 180deg, blue 360deg);
            transition-duration: 4s ;
        }
        div:hover{
            transform: rotate(360deg);

        }
    </style>
</head>
<body>
    <div>
        Spin Wheel
    </div>
</body>
</html>
