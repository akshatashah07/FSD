<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            background-color: lightblue0;
            padding: 15px;
        }
        .item{
            background-color: red;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            width: 200px;
            height: 200px;
        }
        .item:nth-child(2){
            order: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">
            Item-1
        </div>
        <div class="item">
            Item-2
        </div>
        <div class="item">
            Item-3
        </div>
    </div>
</body>
</html>
