<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <svg width="200" height="300">
        <line x1="100" y1="10" x2="200" y2="200" stroke="red" stroke-width="3"></line>
        <line x1="200" y1="10" x2="100" y2="200" stroke="red" stroke-width="3"></line>
    </svg>
    <svg width="200" height="300">
        <line x1="100" y1="10" x2="100" y2="200" stroke="red" stroke-width="3"></line>
        <line x1="200" y1="10" x2="200" y2="200" stroke="red" stroke-width="3"></line>
        <line x1="100" y1="10" x2="200" y2="10" stroke="red" stroke-width="3"></line>
        <line x1="200" y1="10" x2="100" y2="10" stroke="red" stroke-width="3"></line>
    </svg>
    <!-- Triangle -->
     <svg width="200" height="300">
        <line x1="0" y1="200" x2="100" y2="200" stroke="pink" stroke-width="3"></line> <!-- bottom line -->
        <line x1="50" y1="0" x2="0" y2="200" stroke="red" stroke-width="3"></line> <!-- left line -->
        <line x1="50" y1="0" x2="100" y2="200" stroke="blue" stroke-width="3"></line> <!-- right line -->
     </svg> <br>
     <!-- Circle -->
     <svg width="100" height="100" style="border: 1px solid black;">
        <circle  cx="50" cy="50" r="40" stroke="red" stroke-width="3" fill="blue"></circle>
     </svg>
     <svg width="100" height="100" style="border: 1px solid black;">
        <circle cx="0" cy="0" r="40" stroke="red" stroke-width="3" fill="red"></circle>
        <circle cx="90" cy="0" r="40" stroke="red" stroke-width="3" fill="blue"></circle>
        <circle cx="0" cy="90" r="40" stroke="red" stroke-width="3" fill="yellow"></circle>
        <circle cx="95" cy="95" r="40" stroke="red" stroke-width="3" fill="pink"></circle>
        <circle cx="50" cy="50" r="20" stroke="red" stroke-width="3" fill="pink"></circle>
        
     </svg>

     <!-- Rectangle -->
     <svg width="400" height="120" style="border: 1px solid purple;">
        <rect x="50" y="20" rx="20" ry="20" width="300" height="100" stroke="red" stroke-width="3" fill="blue"></rect>
     </svg>

     <!-- Ellipse -->
     <svg width="500" height="140" black>
     <ellipse cx="200" cy="80" rx="100" ry="50" stroke="red" stroke-width="3" fill="blue"></ellipse>
     </svg>

     <!-- LJU Symbol -->
     <svg width="500" height="140" style="border: 1px solid black;">
     <ellipse cx="250" cy="80" rx="100" ry="50" stroke="red" stroke-width="3" fill="blue"></ellipse>
     <text fill="red" font-size="50" x="200" y="100" font-family="verdana">LJU</text>
     </svg>

     <!-- Polygon -->
     <svg width="300" height="250" style="border: 1px solid black;">
     <polygon points="20,100,80,200,200,40,20,10" stroke="orange" stroke-width="3" fill="blue"></polygon>
     </svg>

     <svg width="300" height="250" style="border: 1px solid black;">
     <polygon points="100,20,30,20,56,256" stroke="orange" stroke-width="3" fill="blue"></polygon>
     </svg>

</body>
</html>
