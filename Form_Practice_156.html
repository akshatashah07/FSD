<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="get"><!-- to send data we're using action in the url form--> <!-- in method get and post methods are there for sending data to send the data in the url we're using get method so it is not secure and the data is visible in the url and in the post method the data is not visible and the data is sent in the body part so it is secure than get method...!!!! -->

        <fieldset>
            <legend> Customer Detail </legend>
            <label for="uname"> Name : </label>
            <input type="text" name="name" id="name" placeholder="Enter your Name" autofocus autocomplete="on" required maxlength="10"> <br><br>

            <label> Number : </label>
            <input type="number" name="phone" id="phone" required max="10"> <br> <br>
            
            <label> Email : </label>
            <input type="email" name="email" id="email" required> <br><br>

            <label> Gender : </label> <br> <br>
            <input type="radio" name="Gender" value="Male"> Male <br> <br>
            <input type="radio" name="Gender" value="Female"> Female <br> <br>
            
            <label> Hobbies : </label> <br> <br>
            <input type="checkbox" name="Hobbies" value="music" checked> Music <br> <br>
            <input type="checkbox" name="Hobbies" value="sport"> Sport <br> <br>
            <input type="checkbox" name="Hobbies" value="dance"> Dance <br> <br>
        </fieldset>

        <fieldset>
            <legend> Additional Information </legend>

            <label> Date Of Birth : </label> 
            <input type="date" name="dob" id="dob" min="2005-01-01" max="2026-12-31"> <br> <br>

            <label> Age : </label>
            <input type="number" name="Age" id="age" min="5" max="130" step="1" value="6"> <br> <br>

            <label> Favourite Color : </label>
            <input type="color" name="fcolor" id="fcolor" value="pink"> <br> <br>

            <label> Preferred Browser : </label>
            <input list="Browser" name="brws" id="brws">
                <datalist id="Browser">
                    <option value="Chrome"></option>
                    <option value="Edge"></option>
                    <option value="Firefox"></option>
                    <option value="Opera"></option>
                    <option value="Safari"></option>
                    <option value="Brave"></option>
                </datalist> <br> <br>

            <label> Select Branch : </label>
            <select name="degree_branch" id="degree">
                <option value="select" selected disabled> Select Branch </option>
                <optgroup label="Computer">
                    <option value="CSE"> CSE </option>
                    <option value="CST"> CST </option>
                    <option value="CE"> CE </option>
                    <option value="IT"> IT </option>
                </optgroup>

                <optgroup label="Other">
                    <option value="Mechanical"> Mechanical </option>
                    <option value="Civil"> Civil </option>
                    <option value="EC"> EC </option>
                    <option value="Architecture"> Architecture </option>
                </optgroup>
            </select>
        </fieldset> 

        <fieldset>
            <legend> Feedback : </legend>
            <label> Your Message : </label> <br><br>
            <textarea name="msg" id="msg" rows="10" cols="20"> Enter your Message </textarea> <br> <br>

            <label> Satisfaction Level : </label>
            <input type="range" name="Satisfaction" id="Satisfaction" min="5" max="55" step="25" value="25"> <br><br>

            <input type="hidden" name="userId" value="12345">

            <label> Upload your Resume : </label> <br><br>
            <input type="file" name="Resume" id="Resume" accept=".pdf, .doc" multiple>

        </fieldset>

        <fieldset>
            <legend>Submit Section</legend>
            <input type="submit" value="Submit Form"> <br> <br>
            <input type="reset" value="Reset"> <br><br>
            <button type="submit">Submit (Button Tag)</button>
        </fieldset>
    </form>
</body>
</html>
