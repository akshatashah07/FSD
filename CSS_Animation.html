<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation</title>
    <style>
        img{
            width: 200px;
            height: 200px;
            background-color: red;
            border: 4px solid black;
            animation-name: Example;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-delay: 1s;
            animation-direction: alternate;
            position: relative;
            transition: 2s;
        }
        @keyframes Example {
            0%{background-color: red;transform: translate(0px,0px) rotate(0deg) scale(0.5,0.7); border-radius: 0%;}
            25%{background-color: blue; transform: translate(100px,200px) rotate(50deg) scale(0.7,0.8) skewX(20deg); border-radius: 20%;}
            50%{background-color: black; transform: translate(200px,0px) rotate(140deg) scale(0.9,0.5); border-radius: 30%;}
            75%{background-color: yellow; transform: translate(300px,200px) rotate(200deg) scale(0.6,0.4) skewX(-20deg); border-radius: 40%;}
            100%{background-color: green; transform: translate(400px,0px) rotate(270deg) scale(0.5,0.5); border-radius: 50%;}
        }
    </style>
</head>
<body>
    <img src="beautiful_image">
</body>
</html>
