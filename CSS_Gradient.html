<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #grad1{
            height: 400px;
            width: 400px;
            background-color: pink;
            background-image: linear-gradient(100deg,yellow 20%,red 30%,blue 40%,pink 50%,green 60%);
        }
        #grad2{
            height: 200px;
            width: 400px;
            border-radius: 200px 200px 0 0;
            background-color: pink;
            background-image: radial-gradient(circle at bottom,violet,indigo,blue,green,yellow,orange,red 90%);
        }
        #grad3{
            height: 400px;
            width: 400px;
            border-radius: 50%;
            background-color: pink;
            background-image: conic-gradient(white 45deg,yellow 90deg,green 180deg,blue 360deg);
        }
        #grad4{
            height: 400px;
            width: 400px;
            border-radius: 50%;
            background-color: pink;
            transform: rotate(270deg);
            /*background-image: conic-gradient(red 0deg, red 45deg, yellow 45deg, yellow 90deg, green 90deg, green 180deg, blue 180deg, blue 360deg);*/
            background-image: conic-gradient(red 0deg, yellow 45deg, green 180deg, blue 360deg);      
        }
    </style>
</head>
<body>
    <div id="grad1">
        Linear Gradient
    </div>
    <hr>
    <div id="grad2">
        Radial Gradient
    </div>
    <hr>
    <div id="grad3">
        Conic Gradient
    </div>
    <hr>
    <div id="grad4">
        Conic Gradient
    </div>
</body>
</html>
