<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="5" cellspacing = "10" cellpadding = "10" width = "50%" align="center" bgcolor = "pink"><!-- rules = "rows/cols/all/none/groups"--> 
        <caption> Cost Table </caption>
        <thead>
            <tr bgcolor = "lightblue" align = "center">
                <th>Name</th>
                <th>Cost</th>
            </tr>
        </thead>
        <tbody>
            <tr bgcolor = "lightgreen" align = "center">
                <th> A </th>
                <th> 20 </th>
            </tr>
            <tr bgcolor = "lightgreen" align = "center">
                <th> B </th>
                <th> 30 </th>
            </tr>
        </tbody>
        <footer>
            <tr bgcolor = "lightblue" align = "center">
                <th>Total</th>
                <th>50</th>
            </tr>
        </footer>
    </table>
    
    <!-- Merge tables using rows and columns with rowspan and colspan -->

    <table border="10">
        <tr>
            <td rowspan="2"> C </td>
            <td> A </td>
        </tr>
        <tr>
            <td> B </td>
        </tr>
    </table>

    <table border="10">
        <tr>
            <td colspan="2"> A </td>
        </tr>
        <tr>
            <td> C </td>
            <td> B </td>
        </tr>
    </table>

</body>
</html>
