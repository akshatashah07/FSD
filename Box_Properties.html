<html>
    <head>
        <style>
            .box1{
                width: 300px; 
                height: 150px; 
                margin: 30px auto; 
                padding: 20px;
                border: 4px solid red;
                box-sizing: content-box;
                background-color: lightblue;
                text-align: center;
            }
            .box2{
                width: 300px; 
                height: 150px; 
                margin: 30px auto; 
                padding: 20px;
                border: 4px solid yellow;
                box-sizing: border-box;
                background-color: lightyellow;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1> Box Properties Demonstarations </h1>
        <div class="box1">
            Box-1 sizing : content-box <br> width & height include only content
        </div>
        <div class="box2">
            Box-2 sizing : border-box <br> width & height include content + padding + border
        </div>
    </body>
</html>
