
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Effect</title>

    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: purple;
            color: white;
            text-align: center;
            line-height: 100px;
        }

        .box:hover {
            background-color: red;
        }
    </style>
</head>
<body>

    <div class="box">Hello World!</div>

</body>
</html>
