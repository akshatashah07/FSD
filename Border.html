<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" 
    crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" 
    crossorigin="anonymous"></script>
  </head>
  <body>
    <div>
        <span class="box border border-primary border-1">Border</span> <br> <br>
        <span class="box border-top border-danger border-1">Border</span> <br> <br>
        <span class="box border-bottom border-success border-1">Border</span> <br> <br>
        <span class="box border-start border-warning border-1">Border</span> <br> <br>
        <span class="box border-end border-info border-1">Border</span> <br> <br>
        <span class="box border border-secondary border-2 rounded-circle">Border</span> <br> <br>
        <div class="box border border-secondary border-2 rounded-circle" style="height: 50px; width: 50px;">Border</div>
    </div>
  </body>
</html>
