<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
</head>
<body>
    <!-- text transform -->
    <p class="text-lowercase">This is Typography</p>
    <p class="text-uppercase">This is Typography</p>
    <p class="text-capatilize">This is Typography</p>
    <!-- text decor -->
    <p class="text-decoration-none">This is Typography</p>
    <p class="text-decoration-underline">This is Typography</p>
    <p class="text-decoration-line-through">This is Typography</p>
    <!-- text align -->
    <p class="text-start">This is Typography</p>
    <p class="text-end">This is Typography</p>
    <p class="text-center">This is Typography</p>
</body>
</html>
