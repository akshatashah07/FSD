<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" 
    crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" 
    crossorigin="anonymous"></script>
  </head>
  <body>
    <div class="spinner-border">Loading...</div>
    <div class="spinner-border text-primary spinner-border-sm"></div>
    <div class="spinner-border text-secondary spinner-border-lg"></div>
    <div class="spinner-border text-danger"></div>
    <div class="spinner-border">
        <img src="nature.jpg" alt="">
    </div>
    <div class="spinner-grow">
        <img src="nature.jpg" alt="">
    </div>
    <div class="spinner-grow">Hello World</div>
    <button type="button" class="btn btn-primary">
        <span class="spinner-border text-danger">Loading...</span>
    </button>
    <button type="button" class="btn btn-primary">
        <span class="spinner-grow text-danger">Loading...</span>
    </button>
    <div class="spinner-border text-primary w-75 h-25"></div>
  </body>
