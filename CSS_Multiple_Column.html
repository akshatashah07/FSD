<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .news{
            column-count: 4;
            column-gap: 20px;
            column-rule-style: solid;
            column-rule-color: red;
            column-rule-width: 5px;
            text-align: justify;
        }
    </style>
</head>
<body>
    <h1> CSS Multiple Column </h1>
    <p class="news">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. 
        Impedit eligendi ducimus eius facilis, quos repellat recusandae similique possimus quidem atque animi omnis, 
        ut dignissimos quis explicabo praesentium, voluptate delectus excepturi?
    </p>
</body>
</html>
